<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-main:#0D1117;--bg-side:#0A0F16;--bg-card:#111827;
  --border:#1E2D3D;--accent:#00B4D8;--accent2:#0077B6;
  --adim:rgba(0,180,216,0.08);--agl:rgba(0,180,216,0.15);
  --t1:#F0F6FC;--t2:#8B949E;
  --ok:#39D353;--err:#F85149;--warn:#E3B341;
  --fd:'Syne',sans-serif;--fm:'JetBrains Mono',monospace;--fu:'Inter',sans-serif;
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg-main);color:var(--t1);font-family:var(--fu);-webkit-font-smoothing:antialiased}
#root{height:100vh;display:flex;overflow:hidden}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#1E2D3D;border-radius:2px}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes toastIn{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes dotPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
.fade-up{animation:fadeUp .22s ease-out both}
.d1{animation-delay:.04s}.d2{animation-delay:.08s}.d3{animation-delay:.12s}.d4{animation-delay:.16s}
input,select{color-scheme:dark}
.btn-grad{background:linear-gradient(135deg,#00B4D8,#0077B6);border:none;border-radius:8px;color:#fff;cursor:pointer;font-family:var(--fu);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;padding:8px 16px;transition:all .15s ease}
.btn-grad:hover{box-shadow:0 0 20px rgba(0,180,216,.35);transform:translateY(-1px)}
.card{background:rgba(17,24,39,.85);border:1px solid rgba(0,180,216,.1);border-radius:12px;backdrop-filter:blur(8px)}
.toast{position:fixed;top:20px;right:20px;z-index:9999;background:var(--bg-card);border:1px solid rgba(0,180,216,.25);border-radius:10px;padding:13px 18px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--t1);box-shadow:0 8px 32px rgba(0,0,0,.5);animation:toastIn .3s ease-out both;max-width:300px}
@keyframes scaleIn{from{opacity:0;transform:scale(.96) translateY(-8px)}to{opacity:1;transform:scale(1) translateY(0)}}
.srch-card{animation:scaleIn .18s cubic-bezier(0.34,1.56,0.64,1) both}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid rgba(0,180,216,.5);outline-offset:2px}
.notif-item:hover{background:rgba(0,180,216,.05)!important}

/* ── Responsive grid helpers ── */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.chart-grid{display:grid;grid-template-columns:1.65fr 1fr;gap:14px}
.mobile-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;backdrop-filter:blur(2px)}
.sidebar-drawer{transition:transform 0.3s cubic-bezier(0.4,0,0.2,1)!important}
.hamburger{display:none;align-items:center;justify-content:center;width:36px;height:36px;border-radius:8px;background:rgba(30,45,61,.5);border:1px solid var(--border);cursor:pointer;color:var(--t2);flex-shrink:0}
.topbar-search{display:flex}
.dash-padding{padding:24px}

@media(max-width:1024px){
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .chart-grid{grid-template-columns:1fr}
}
@media(max-width:640px){
  .kpi-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .chart-grid{grid-template-columns:1fr}
  .topbar-search{display:none!important}
  .hamburger{display:flex}
  .mobile-overlay{display:block}
  .dash-padding{padding:14px}
  .toast{top:auto;bottom:20px;right:12px;left:12px;max-width:none}
  .btn-grad{padding:7px 12px;font-size:12px}
}
@media(max-width:400px){
  .kpi-grid{grid-template-columns:1fr}
}
@media(max-width:768px){
  .settings-grid{grid-template-columns:1fr!important}
}

//  CHARTS (custom SVG — no external deps)

/* ── Sparkline ── */
const Spark = ({ data, color='#00B4D8', w=80, h=32 }) => {
  if (!data || data.length < 2) return null;
  const mx=Math.max(...data), mn=Math.min(...data), rng=(mx-mn)||1;
  const pts = data.map((v,i)=>`${(i/(data.length-1))*w},${h-((v-mn)/rng)*h}`).join(' ');
  const uid = color.replace(/[^a-z0-9]/gi,'');
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} style={{display:'block',overflow:'visible'}}>
      <defs><linearGradient id={`sg${uid}`} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={color} stopOpacity=".3"/><stop offset="100%" stopColor={color} stopOpacity="0"/></linearGradient></defs>
      <polygon points={`0,${h} ${pts} ${w},${h}`} fill={`url(#sg${uid})`}/>
      <polyline points={pts} fill="none" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
};

/* ── Bar chart ── */
const InvChart = ({ data, type='bar' }) => {
  const W=560, H=190, PL=44, PB=28, PT=10, PR=8;
  const cW=W-PL-PR, cH=H-PB-PT;
  const vals = data.map(d=>d.value);
  const mx=Math.max(...vals), mn=0;
  const avg = vals.reduce((s,v)=>s+v,0)/vals.length;
  const bW = Math.floor(cW/data.length*0.6);
  const x = (i) => PL + (i/(data.length-1||1))*cW;
  const y = (v)  => PT + cH - ((v-mn)/(mx-mn||1))*cH;
  const [tip, setTip] = React.useState(null);
  const yTicks = [0, mx*0.25, mx*0.5, mx*0.75, mx].map(v=>Math.round(v));

  if (type==='bar') return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:H,display:'block'}}>
      <defs>
        <linearGradient id="bGr" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#00B4D8"/><stop offset="100%" stopColor="#0077B6"/></linearGradient>
        <linearGradient id="bGrH" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#38c8e8"/><stop offset="100%" stopColor="#0099d8"/></linearGradient>
      </defs>
      {yTicks.map((v,i)=>{
        const cy = PT + cH - (v/(mx||1))*cH;
        return <g key={i}><line x1={PL} y1={cy} x2={W-PR} y2={cy} stroke="rgba(30,45,61,.7)" strokeWidth="1" strokeDasharray="3 3"/><text x={PL-4} y={cy+4} textAnchor="end" fontSize="9" fill="#8B949E" fontFamily="JetBrains Mono">${v>=1000?`${(v/1000).toFixed(0)}k`:v}</text></g>;
      })}
      {/* avg line */}
      <line x1={PL} y1={y(avg)} x2={W-PR} y2={y(avg)} stroke="#E3B341" strokeWidth="1.5" strokeDasharray="5 4"/>
      {data.map((d,i)=>{
        const bX = PL + (i+0.5)*(cW/data.length) - bW/2;
        const bH2 = ((d.value-mn)/(mx-mn||1))*cH;
        const bY = PT+cH-bH2;
        const isT = tip===i;
        return (
          <g key={i} onMouseEnter={()=>setTip(i)} onMouseLeave={()=>setTip(null)} style={{cursor:'default'}}>
            <rect x={bX} y={bY} width={bW} height={bH2} rx="2" fill={isT?'url(#bGrH)':'url(#bGr)'} opacity={isT?1:.85}/>
            {isT && <text x={bX+bW/2} y={bY-6} textAnchor="middle" fontSize="9" fill="#00B4D8" fontFamily="JetBrains Mono">${d.value.toLocaleString()}</text>}
            <text x={bX+bW/2} y={H-8} textAnchor="middle" fontSize="8" fill="#8B949E" fontFamily="JetBrains Mono">{d.date.replace('Abr ','')}</text>
          </g>
        );
      })}
    </svg>
  );

  // line / area
  const pts = data.map((d,i)=>`${x(i)},${y(d.value)}`).join(' ');
  const area = `${PL},${PT+cH} ${pts} ${W-PR},${PT+cH}`;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:H,display:'block'}}>
      <defs><linearGradient id="aGr" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#00B4D8" stopOpacity=".25"/><stop offset="100%" stopColor="#00B4D8" stopOpacity="0"/></linearGradient></defs>
      {yTicks.map((v,i)=>{const cy=PT+cH-(v/(mx||1))*cH;return <g key={i}><line x1={PL} y1={cy} x2={W-PR} y2={cy} stroke="rgba(30,45,61,.7)" strokeWidth="1" strokeDasharray="3 3"/><text x={PL-4} y={cy+4} textAnchor="end" fontSize="9" fill="#8B949E" fontFamily="JetBrains Mono">${v>=1000?`${(v/1000).toFixed(0)}k`:v}</text></g>;})}
      {type==='area' && <polygon points={area} fill="url(#aGr)"/>}
      <polyline points={pts} fill="none" stroke="#00B4D8" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>
      {data.map((d,i)=>(
        <circle key={i} cx={x(i)} cy={y(d.value)} r="3.5" fill="#00B4D8" onMouseEnter={()=>setTip(i)} onMouseLeave={()=>setTip(null)} style={{cursor:'default'}}>
          {tip===i && <title>${d.date}: ${d.value.toLocaleString()}</title>}
        </circle>
      ))}
      {data.map((d,i)=><text key={i} x={x(i)} y={H-8} textAnchor="middle" fontSize="8" fill="#8B949E" fontFamily="JetBrains Mono">{d.date.replace('Abr ','')}</text>)}
    </svg>
  );
};

/* ── Donut chart ── */
const DonutChart = ({ data }) => {
  const [active, setActive] = React.useState(null);
  const R=50, r=32, cx=65, cy=65;
  let cumPct = 0;
  const slices = data.map((d,i)=>{
    const pct = d.value/100;
    const startA = cumPct*2*Math.PI - Math.PI/2;
    cumPct += pct;
    const endA = cumPct*2*Math.PI - Math.PI/2;
    const x1=cx+R*Math.cos(startA), y1=cy+R*Math.sin(startA);
    const x2=cx+R*Math.cos(endA),   y2=cy+R*Math.sin(endA);
    const ix1=cx+r*Math.cos(startA),iy1=cy+r*Math.sin(startA);
    const ix2=cx+r*Math.cos(endA),  iy2=cy+r*Math.sin(endA);
    const lg = pct > 0.5 ? 1 : 0;
    const path = `M${x1},${y1} A${R},${R} 0 ${lg} 1 ${x2},${y2} L${ix2},${iy2} A${r},${r} 0 ${lg} 0 ${ix1},${iy1} Z`;
    return { ...d, path, i };
  });
  return (
    <div style={{display:'flex',alignItems:'center',gap:20}}>
      <svg width="130" height="130" viewBox="0 0 130 130" style={{flexShrink:0}}>
        {slices.map(s=>(
          <path key={s.i} d={s.path} fill={s.color} opacity={active===null||active===s.i?1:.35} stroke="var(--bg-card)" strokeWidth="1.5"
            onMouseEnter={()=>setActive(s.i)} onMouseLeave={()=>setActive(null)} style={{cursor:'default',transition:'opacity .15s'}}/>
        ))}
        <text x="65" y="62" textAnchor="middle" fontFamily="JetBrains Mono" fontWeight="700" fontSize="16" fill="#F0F6FC">623</text>
        <text x="65" y="76" textAnchor="middle" fontFamily="Inter" fontSize="8" fill="#8B949E" letterSpacing="0.05em">RESULTADOS</text>
      </svg>
      <div style={{display:'flex',flexDirection:'column',gap:9}}>
        {data.map((item,i)=>(
          <div key={i} style={{display:'flex',alignItems:'center',gap:8,opacity:active===null||active===i?1:.35,transition:'opacity .15s',cursor:'default'}}
            onMouseEnter={()=>setActive(i)} onMouseLeave={()=>setActive(null)}>
            <div style={{width:8,height:8,borderRadius:2,background:item.color,flexShrink:0}}></div>
            <span style={{fontSize:12,color:'var(--t2)'}}>{item.name}</span>
            <span style={{fontSize:12,fontFamily:'JetBrains Mono',fontWeight:700,color:'var(--t1)',marginLeft:'auto',paddingLeft:12}}>{item.value}%</span>
          </div>
        ))}
      </div>
    </div>
  );
};

/* ── Report line chart ── */
const RptLine = ({ data }) => {
  const W=500,H=210,PL=48,PB=28,PT=10,PR=20;
  const cW=W-PL-PR, cH=H-PB-PT;
  const iVals=data.map(d=>d.investment), rVals=data.map(d=>d.results);
  const iMax=Math.max(...iVals)||1, rMax=Math.max(...rVals)||1;
  const xi=(i)=>PL+(i/(data.length-1||1))*cW;
  const yi=(v)=>PT+cH-(v/iMax)*cH;
  const yr=(v)=>PT+cH-(v/rMax)*cH;
  const ipts=data.map((d,i)=>`${xi(i)},${yi(d.investment)}`).join(' ');
  const rpts=data.map((d,i)=>`${xi(i)},${yr(d.results)}`).join(' ');
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:H,display:'block'}}>
      {[0,.25,.5,.75,1].map((f,i)=>{const cy=PT+cH-f*cH;return <line key={i} x1={PL} y1={cy} x2={W-PR} y2={cy} stroke="rgba(30,45,61,.7)" strokeWidth="1" strokeDasharray="3 3"/>;})}
      {data.map((d,i)=><text key={i} x={xi(i)} y={H-8} textAnchor="middle" fontSize="10" fill="#8B949E" fontFamily="JetBrains Mono">{d.date}</text>)}
      <polyline points={ipts} fill="none" stroke="#00B4D8" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round"/>
      <polyline points={rpts} fill="none" stroke="#39D353" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" strokeDasharray="6 3"/>
      {data.map((d,i)=><circle key={`i${i}`} cx={xi(i)} cy={yi(d.investment)} r="4" fill="#00B4D8"/>)}
      {data.map((d,i)=><circle key={`r${i}`} cx={xi(i)} cy={yr(d.results)} r="4" fill="#39D353"/>)}
    </svg>
  );
};

/* ── Compare bar chart ── */
const CmpBar = ({ data }) => {
  const W=500,H=210,PL=10,PB=28,PT=10,PR=10;
  const cW=W-PL-PR, cH=H-PB-PT;
  const iVals=data.map(d=>d.investment), rVals=data.map(d=>d.results);
  const mx=Math.max(...iVals)||1;
  const bSlot=cW/data.length, bW=Math.floor(bSlot*0.28);
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:H,display:'block'}}>
      <defs>
        <linearGradient id="cg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#00B4D8"/><stop offset="100%" stopColor="#0077B6"/></linearGradient>
        <linearGradient id="cg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#39D353"/><stop offset="100%" stopColor="#1a7a28"/></linearGradient>
      </defs>
      {[0,.25,.5,.75,1].map((f,i)=>{const cy=PT+cH-f*cH;return <line key={i} x1={PL} y1={cy} x2={W-PR} y2={cy} stroke="rgba(30,45,61,.7)" strokeWidth="1" strokeDasharray="3 3"/>;})}
      {data.map((d,i)=>{
        const slotX=PL+i*bSlot+bSlot/2;
        const iH=((d.investment/mx))*cH, rH=((d.results/Math.max(...rVals)||1))*cH;
        return (
          <g key={i}>
            <rect x={slotX-bW-2} y={PT+cH-iH} width={bW} height={iH} rx="2" fill="url(#cg1)"/>
            <rect x={slotX+2} y={PT+cH-rH} width={bW} height={rH} rx="2" fill="url(#cg2)"/>
            <text x={slotX} y={H-8} textAnchor="middle" fontSize="9" fill="#8B949E" fontFamily="JetBrains Mono">{d.name}</text>
          </g>
        );
      })}
    </svg>
  );
};

  const [cType, setCType]   = React.useState('bar');
  const [sCol, setSCol]     = React.useState('investment');
  const [sDir, setSDir]     = React.useState('desc');
  const [q, setQ]           = React.useState('');
  const [sf, setSf]         = React.useState('all');
  const [pg, setPg]         = React.useState(0);
  const PG = 5;
  const opts = [{v:'7',l:'Últimos 7 días'},{v:'14',l:'Últimos 14 días'},{v:'30',l:'Últimos 30 días'},{v:'custom',l:'Personalizado'}];
  const sort = col => { if(sCol===col)setSDir(d=>d==='asc'?'desc':'asc'); else{setSCol(col);setSDir('desc');} };
  const rows = CAMPAIGNS.filter(c=>sf==='all'||c.status===sf).filter(c=>!q||c.name.toLowerCase().includes(q.toLowerCase()))
    .sort((a,b)=>{const d=sDir==='asc'?1:-1;if(sCol==='name')return d*a.name.localeCompare(b.name);return d*(a[sCol]-b[sCol]);});
  const paged = rows.slice(pg*PG,(pg+1)*PG);
  const tot   = Math.ceil(rows.length/PG);
  const TH = ({col,l}) => (
    <th style={{padding:'11px 14px',textAlign:'left'}}>
      <div onClick={()=>col!=='trend'&&col!=='actions'&&sort(col)} style={{display:'flex',alignItems:'center',gap:4,fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em',color:sCol===col?'var(--accent)':'var(--t2)',cursor:col==='trend'||col==='actions'?'default':'pointer',userSelect:'none'}}>
        {l}{col!=='trend'&&col!=='actions'&&<Ic n="chevD" s={10} c={sCol===col?'var(--accent)':'var(--t2)'}/>}
      </div>
    </th>
  );
  return (
    <div style={{padding:24,overflowY:'auto',height:'100%',display:'flex',flexDirection:'column',gap:20}}>
      <div className="fade-up" style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:12}}>
        <div>
          <h1 style={{fontFamily:'Syne',fontSize:28,fontWeight:800,color:'var(--t1)',marginBottom:3}}>Resumen de rendimiento</h1>
          <p style={{fontSize:13,color:'var(--t2)'}}>Cuenta principal · {opts.find(o=>o.v===period)?.l}</p>
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <div style={{position:'relative'}}>
            <button onClick={()=>setPOpen(o=>!o)} style={{display:'flex',alignItems:'center',gap:8,background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:8,padding:'8px 13px',color:'var(--t1)',cursor:'pointer',fontSize:13,fontFamily:'Inter'}}>
              <Ic n="calendar" s={14} c="var(--t2)"/>{opts.find(o=>o.v===period)?.l}<Ic n="chevD" s={13} c="var(--t2)"/>
            </button>
            {pOpen && <div style={{position:'absolute',top:44,right:0,zIndex:50,background:'var(--bg-card)',border:'1px solid var(--border)',borderRadius:8,minWidth:180,boxShadow:'0 8px 24px rgba(0,0,0,.5)',overflow:'hidden'}}>
              {opts.map(o=><div key={o.v} onClick={()=>{setPeriod(o.v);setPOpen(false);}} style={{padding:'9px 14px',fontSize:13,cursor:'pointer',color:period===o.v?'var(--accent)':'var(--t1)',background:period===o.v?'rgba(0,180,216,.08)':'transparent'}}
                onMouseEnter={e=>{if(period!==o.v)e.currentTarget.style.background='rgba(0,180,216,.05)';}} onMouseLeave={e=>{if(period!==o.v)e.currentTarget.style.background='transparent';}}>{o.l}</div>)}
            </div>}
          </div>
          <button className="btn-grad" onClick={onNew}><Ic n="plus" s={15}/>Nueva Campaña</button>
        </div>
      </div>
      {/* KPIs */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:14}}>
        {KPIS.map((k,i)=><KPICard key={k.label} kpi={k} delay={i*70}/>)}
      </div>
      {/* Charts */}
      <div style={{display:'grid',gridTemplateColumns:'1.65fr 1fr',gap:14}}>
        <div className="card" style={{padding:20}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
            <div><div style={{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.1em',color:'var(--t2)',marginBottom:2}}>Inversión Diaria</div><div style={{fontSize:13,fontWeight:600,color:'var(--t1)'}}>Últimos 14 días</div></div>
            <div style={{display:'flex',gap:3}}>
              {[['bar','Barras'],['line','Línea'],['area','Área']].map(([t,l])=>(
                <button key={t} onClick={()=>setCType(t)} style={{padding:'4px 9px',borderRadius:6,border:'none',cursor:'pointer',fontSize:11,fontWeight:600,fontFamily:'Inter',background:cType===t?'rgba(0,180,216,.15)':'transparent',color:cType===t?'var(--accent)':'var(--t2)',transition:'all .15s'}}>{l}</button>
              ))}
            </div>
          </div>
          <InvChart data={DAILY} type={cType}/>
        </div>
        <div className="card" style={{padding:20}}>
          <div style={{marginBottom:18}}><div style={{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.1em',color:'var(--t2)',marginBottom:2}}>Distribución</div><div style={{fontSize:13,fontWeight:600,color:'var(--t1)'}}>Por Objetivo</div></div>
          <DonutChart data={DONUT}/>
        </div>
      </div>
      {/* Table */}
      <div className="card" style={{overflow:'hidden'}}>
        <div style={{padding:'14px 18px',borderBottom:'1px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center',gap:10,flexWrap:'wrap'}}>
          <div style={{fontFamily:'Syne',fontSize:15,fontWeight:700}}>Campañas Activas</div>
          <div style={{display:'flex',gap:8}}>
            <div style={{position:'relative'}}>
              <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Buscar campaña..." style={{background:'var(--bg-main)',border:'1px solid var(--border)',borderRadius:7,padding:'6px 12px 6px 30px',color:'var(--t1)',fontSize:12,fontFamily:'Inter',width:190,outline:'none'}}/>
              <div style={{position:'absolute',left:9,top:'50%',transform:'translateY(-50%)'}}><Ic n="search" s={13} c="var(--t2)"/></div>
            </div>
            <select value={sf} onChange={e=>{setSf(e.target.value);setPg(0);}} style={{background:'var(--bg-main)',border:'1px solid var(--border)',borderRadius:7,padding:'6px 10px',color:'var(--t2)',fontSize:12,fontFamily:'Inter',outline:'none',cursor:'pointer'}}>
              <option value="all">Todos los estados</option><option value="active">Activas</option><option value="review">En revisión</option><option value="paused">Pausadas</option>
            </select>
          </div>
        </div>
        <div style={{overflowX:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse'}}>
            <thead><tr style={{borderBottom:'1px solid var(--border)'}}>
              {[{col:'name',l:'Nombre'},{col:'status',l:'Estado'},{col:'investment',l:'Inversión'},{col:'results',l:'Resultados'},{col:'cpr',l:'CPR'},{col:'trend',l:'Tendencia'},{col:'actions',l:'Acciones'}].map(h=><TH key={h.col} col={h.col} l={h.l}/>)}
            </tr></thead>
            <tbody>
              {paged.map((c,i)=><CampRow key={c.id} c={c} delay={i*40}/>)}
              {paged.length===0 && <tr><td colSpan={7}><div style={{display:'flex',flexDirection:'column',alignItems:'center',padding:'52px 0',gap:12}}>
                <svg width="54" height="54" viewBox="0 0 54 54" fill="none"><rect x="3" y="3" width="48" height="48" rx="10" stroke="rgba(0,180,216,.22)" strokeWidth="1.5" strokeDasharray="5 3"/><path d="M19 21h16M19 27h10" stroke="rgba(0,180,216,.28)" strokeWidth="2" strokeLinecap="round"/><circle cx="27" cy="13" r="4" stroke="rgba(0,180,216,.38)" strokeWidth="1.5"/><path d="M33 36l4 4M33 40l4-4" stroke="rgba(0,180,216,.28)" strokeWidth="1.5" strokeLinecap="round"/></svg>
                <div style={{fontSize:14,fontWeight:600,color:'var(--t2)'}}>Sin resultados</div>
                <div style={{fontSize:12,color:'var(--t2)',opacity:.55}}>Prueba con otros filtros o busca por nombre</div>
              </div></td></tr>}
            </tbody>
          </table>
        </div>
        <div style={{padding:'10px 18px',borderTop:'1px solid var(--border)',display:'flex',justifyContent:'space-between',alignItems:'center',fontSize:12,color:'var(--t2)'}}>
          <span>Mostrando {pg*PG+1}–{Math.min((pg+1)*PG,rows.length)} de {rows.length} campañas</span>
          <div style={{display:'flex',gap:5}}>
            {['Anterior','Siguiente'].map((l,i)=>{const dis=i===0?pg===0:pg>=tot-1;return(
              <button key={l} onClick={()=>setPg(p=>i===0?Math.max(0,p-1):Math.min(tot-1,p+1))} disabled={dis} style={{padding:'5px 12px',borderRadius:6,border:'1px solid var(--border)',background:'transparent',color:dis?'var(--t2)':'var(--t1)',cursor:dis?'not-allowed':'pointer',fontSize:12,fontFamily:'Inter',opacity:dis?.35:1}}>{l}</button>
            );})}
          </div>
        </div>
      </div>
    </div>
  );
};

const CampCard = ({ c, delay=0 }) => {
  const [hov,setHov]=React.useState(false);
  const tc=c.tdir==='up'?'#39D353':c.tdir==='down'?'#F85149':'#8B949E';
  const pct=Math.round((c.investment/c.budget)*100);
  const canA=c.status==='paused'||c.status==='review';
  return (
    <div onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)} className="card" style={{padding:18,border:`1px solid ${hov?'rgba(0,180,216,.28)':'rgba(0,180,216,.1)'}`,transform:hov?'translateY(-2px)':'none',boxShadow:hov?'0 10px 36px rgba(0,0,0,.35)':'none',transition:'all .2s ease',animation:`fadeUp .35s ${delay}ms ease-out both`,display:'flex',flexDirection:'column',gap:14}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
        <div><div style={{fontSize:14,fontWeight:700,color:'var(--t1)',marginBottom:3}}>{c.name}</div><div style={{fontSize:11,color:'var(--t2)'}}>{c.obj} · {c.platform}</div></div>
        <Badge status={c.status}/>
      </div>
      <div>
        <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:'var(--t2)',marginBottom:5}}><span>Presupuesto</span><span style={{fontFamily:'JetBrains Mono',color:pct>85?'var(--err)':'var(--t1)',fontWeight:600}}>{pct}%</span></div>
        <div style={{background:'var(--border)',borderRadius:4,height:5,overflow:'hidden'}}><div style={{height:'100%',width:`${pct}%`,borderRadius:4,transition:'width .5s ease',background:pct>85?'linear-gradient(90deg,var(--err),#ff6b6b)':'linear-gradient(90deg,#00B4D8,#0077B6)'}}/></div>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:6}}>
        {[{l:'Inversión',v:`$${c.investment.toLocaleString()}`},{l:'Resultados',v:c.results},{l:'CPR',v:`$${c.cpr.toFixed(2)}`}].map(m=>(
          <div key={m.l} style={{textAlign:'center',background:'rgba(0,180,216,.04)',borderRadius:7,padding:'8px 4px'}}>
            <div style={{fontSize:9,color:'var(--t2)',textTransform:'uppercase',letterSpacing:'.06em',marginBottom:3}}>{m.l}</div>
            <div style={{fontFamily:'JetBrains Mono',fontSize:13,fontWeight:700,color:'var(--t1)'}}>{m.v}</div>
          </div>
        ))}
      </div>
      <div style={{display:'flex',justifyContent:'center'}}><Spark data={c.trend} color={tc} w={180} h={34}/></div>
      <div style={{display:'flex',gap:6,borderTop:'1px solid var(--border)',paddingTop:12}}>
        {[{l:'Editar',i:'edit',c:'var(--t2)'},{l:canA?'Activar':'Pausar',i:canA?'play':'pause',c:canA?'var(--ok)':'var(--warn)'},{l:'Ver',i:'eye',c:'var(--accent)'}].map(b=>(
          <button key={b.l} style={{flex:1,padding:'6px 0',borderRadius:6,border:'1px solid var(--border)',background:'transparent',cursor:'pointer',fontSize:11,fontWeight:600,color:b.c,display:'flex',alignItems:'center',justifyContent:'center',gap:4,fontFamily:'Inter',transition:'background .12s'}}
            onMouseEnter={e=>e.currentTarget.style.background='rgba(0,180,216,.06)'} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
            <Ic n={b.i} s={12} c={b.c}/>{b.l}
          </button>
        ))}
      </div>
    </div>
  );
};

const RptsView = () => {
  const [period,setPeriod]=React.useState('30');
  const [dop,setDop]=React.useState(false);
  const [sel,setSel]=React.useState(['all']);
  const toggle=id=>{if(id==='all'){setSel(['all']);return;}const n=sel.filter(c=>c!=='all');setSel(n.includes(id)?n.filter(c=>c!==id):[...n,id]);};

//  MODAL

const Modal = ({ open, onClose, onDone }) => {
  const [step,setStep]=React.useState(0);
  const [form,setForm]=React.useState({name:'',obj:'',budget:'',start:'',end:'',audience:'',platform:''});
  const [err,setErr]=React.useState(false);
  if(!open) return null;
  const steps=['Nombre y objetivo','Presupuesto y fechas','Públicos y plataforma'];
  const set=(k,v)=>{setErr(false);setForm(f=>({...f,[k]:v}));};
  const canNext=step===0?(form.name.trim()&&form.obj):step===1?(form.budget&&Number(form.budget)>0&&form.start&&form.end):true;
  const tryNext=()=>{if(canNext){setErr(false);setStep(s=>s+1);}else setErr(true);};
  const inp={width:'100%',background:'#0D1117',border:'1px solid #1E2D3D',borderRadius:8,padding:'9px 13px',color:'#F0F6FC',fontSize:13,fontFamily:'Inter',outline:'none',transition:'border-color .15s'};
  const lbl={fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em',color:'#8B949E',marginBottom:6,display:'block'};
  const done=()=>{onDone();onClose();setTimeout(()=>{setStep(0);setForm({name:'',obj:'',budget:'',start:'',end:'',audience:'',platform:''}); },300);};
  return (
    <div onClick={e=>{if(e.target===e.currentTarget)onClose();}} style={{position:'fixed',inset:0,zIndex:1000,background:'rgba(0,0,0,.72)',backdropFilter:'blur(10px)',display:'flex',alignItems:'center',justifyContent:'center',padding:16,animation:'fadeUp .2s ease-out'}}>
      <div style={{background:'#111827',border:'1px solid rgba(0,180,216,.15)',borderRadius:16,padding:28,width:'100%',maxWidth:480,position:'relative',boxShadow:'0 24px 64px rgba(0,0,0,.7)',animation:'fadeUp .25s ease-out'}}>
        <div style={{position:'absolute',top:0,left:0,right:0,height:1,background:'linear-gradient(90deg,transparent,#00B4D8,transparent)',borderRadius:'16px 16px 0 0'}}/>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:22}}>
          <div><div style={{fontFamily:'Syne',fontSize:20,fontWeight:800,color:'var(--t1)',marginBottom:3}}>Nueva Campaña</div><div style={{fontSize:12,color:'var(--t2)'}}>Paso {step+1} de {steps.length} — {steps[step]}</div></div>
          <button onClick={onClose} style={{width:32,height:32,borderRadius:8,background:'rgba(0,0,0,.3)',border:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',color:'var(--t2)'}}><Ic n="x" s={16}/></button>
        </div>
        <div style={{display:'flex',gap:8,marginBottom:24}}>
          {steps.map((s,i)=><div key={i} style={{flex:1}}><div style={{height:2.5,borderRadius:2,background:i<=step?'var(--accent)':'var(--border)',transition:'background .3s',marginBottom:6}}/><div style={{fontSize:10,color:i===step?'var(--accent)':'var(--t2)',fontWeight:i===step?600:400}}>{s}</div></div>)}
        </div>
        <div style={{marginBottom:24}}>
          {step===0 && (
            <div style={{display:'flex',flexDirection:'column',gap:16}}>
              <div><span style={lbl}>Nombre de campaña <span style={{color:'var(--err)'}}>*</span></span><input value={form.name} onChange={e=>set('name',e.target.value)} placeholder="Ej: Black Friday Q3" style={{...inp,borderColor:err&&!form.name.trim()?'rgba(248,81,73,.6)':'#1E2D3D'}} onFocus={e=>e.target.style.borderColor='#00B4D8'} onBlur={e=>e.target.style.borderColor=err&&!form.name.trim()?'rgba(248,81,73,.6)':'#1E2D3D'}/></div>
              <div><span style={lbl}>Objetivo principal</span>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
                  {['Conversiones','Tráfico','Alcance','Leads','Engagement','Ventas'].map(o=>(
                    <div key={o} onClick={()=>set('obj',o)} style={{padding:'10px 14px',borderRadius:8,cursor:'pointer',fontSize:13,fontWeight:500,border:`1px solid ${form.obj===o?'var(--accent)':'#1E2D3D'}`,background:form.obj===o?'rgba(0,180,216,.1)':'rgba(0,0,0,.2)',color:form.obj===o?'var(--accent)':'#8B949E',transition:'all .15s'}}>{o}</div>
                  ))}
                </div>
              </div>
            </div>
          )}
          {step===1 && (
            <div style={{display:'flex',flexDirection:'column',gap:16}}>
              <div><span style={lbl}>Presupuesto total (USD)</span><input type="number" value={form.budget} onChange={e=>set('budget',e.target.value)} placeholder="Ej: 10000" style={inp} onFocus={e=>e.target.style.borderColor='#00B4D8'} onBlur={e=>e.target.style.borderColor='#1E2D3D'}/></div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
                <div><span style={lbl}>Fecha inicio</span><input type="date" value={form.start} onChange={e=>set('start',e.target.value)} style={inp}/></div>
                <div><span style={lbl}>Fecha fin</span><input type="date" value={form.end} onChange={e=>set('end',e.target.value)} style={inp}/></div>
              </div>
              {form.budget && <div style={{background:'rgba(0,180,216,.06)',border:'1px solid rgba(0,180,216,.15)',borderRadius:8,padding:'10px 14px',fontSize:12}}><span style={{color:'var(--accent)',fontWeight:700,fontFamily:'JetBrains Mono'}}>${(Number(form.budget)/30).toFixed(2)}</span><span style={{color:'var(--t2)'}}> · presupuesto diario estimado</span></div>}
            </div>
          )}
          {step===2 && (
            <div style={{display:'flex',flexDirection:'column',gap:16}}>
              <div><span style={lbl}>Público objetivo</span>
                <select value={form.audience} onChange={e=>set('audience',e.target.value)} style={{...inp,cursor:'pointer'}}>
                  <option value="">Seleccionar público...</option>
                  <option>Remarketing — Visitantes web</option><option>Lookalike — 1%</option><option>Intereses — Tecnología</option><option>Compradores frecuentes</option>
                </select>
              </div>
              <div><span style={lbl}>Plataforma</span>
                <div style={{display:'flex',gap:8}}>
                  {['Meta','Google','TikTok'].map(p=><div key={p} onClick={()=>set('platform',p)} style={{flex:1,padding:'12px 0',borderRadius:8,cursor:'pointer',textAlign:'center',border:`1px solid ${form.platform===p?'var(--accent)':'#1E2D3D'}`,background:form.platform===p?'rgba(0,180,216,.1)':'rgba(0,0,0,.2)',color:form.platform===p?'var(--accent)':'#8B949E',fontSize:13,fontWeight:600,transition:'all .15s'}}>{p}</div>)}
                </div>
              </div>
              <div style={{background:'rgba(0,0,0,.25)',border:'1px solid #1E2D3D',borderRadius:10,padding:14,display:'flex',flexDirection:'column',gap:8}}>
                <div style={{fontSize:10,fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em',color:'#8B949E',marginBottom:2}}>Resumen</div>
                {[{l:'Nombre',v:form.name||'—'},{l:'Objetivo',v:form.obj||'—'},{l:'Presupuesto',v:form.budget?`$${Number(form.budget).toLocaleString()}`:'—'},{l:'Plataforma',v:form.platform||'—'}].map(r=>(
                  <div key={r.l} style={{display:'flex',justifyContent:'space-between',fontSize:12}}><span style={{color:'#8B949E'}}>{r.l}</span><span style={{color:'#F0F6FC',fontWeight:600}}>{r.v}</span></div>
                ))}
              </div>
            </div>
          )}
        </div>
        {err && <div style={{marginBottom:14,padding:'9px 13px',background:'rgba(248,81,73,.08)',border:'1px solid rgba(248,81,73,.25)',borderRadius:8,fontSize:12,color:'var(--err)',display:'flex',alignItems:'center',gap:8,animation:'fadeUp .15s ease-out'}}>
          <Ic n="x" s={13} c="var(--err)"/>
          {step===0?'Ingresa un nombre y selecciona un objetivo':step===1?'Completa el presupuesto y las fechas':'Completa los campos requeridos'}
        </div>}
        <div style={{display:'flex',justifyContent:'space-between',gap:10}}>
          <button onClick={onClose} style={{padding:'8px 18px',borderRadius:8,border:'1px solid var(--border)',background:'transparent',color:'var(--t2)',cursor:'pointer',fontSize:13,fontFamily:'Inter'}}>Cancelar</button>
          <div style={{display:'flex',gap:8}}>
            {step>0 && <button onClick={()=>{setErr(false);setStep(s=>s-1);}} style={{padding:'8px 18px',borderRadius:8,border:'1px solid var(--border)',background:'transparent',color:'var(--t1)',cursor:'pointer',fontSize:13,fontFamily:'Inter'}}>← Anterior</button>}
            {step<steps.length-1
              ? <button className="btn-grad" onClick={tryNext} style={{opacity:canNext?1:.65,transition:'opacity .15s'}}>Siguiente →</button>
              : <button onClick={done} style={{padding:'8px 20px',borderRadius:8,border:'none',background:'linear-gradient(135deg,#39D353,#1a7a28)',color:'white',cursor:'pointer',fontSize:13,fontWeight:600,fontFamily:'Inter',display:'flex',alignItems:'center',gap:6}}><Ic n="check" s={14} c="white"/>Crear Campaña</button>
            }
          </div>
        </div>
      </div>
    </div>
  );
};

          <Ic n="search" s={18} c="var(--t2)"/>
          <input id="srch-inp" value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>e.key==='Escape'&&onClose()} placeholder="Buscar campañas..." style={{flex:1,background:'transparent',border:'none',color:'var(--t1)',fontSize:16,outline:'none',fontFamily:'Inter'}}/>
          {q && <button onClick={()=>setQ('')} style={{background:'rgba(30,45,61,.7)',border:'none',borderRadius:5,padding:'2px 8px',fontSize:11,color:'var(--t2)',cursor:'pointer',fontFamily:'JetBrains Mono'}}>✕</button>}
          <span onClick={onClose} style={{fontSize:11,color:'var(--t2)',background:'rgba(30,45,61,.8)',borderRadius:5,padding:'2px 7px',fontFamily:'JetBrains Mono',cursor:'pointer',userSelect:'none'}}>ESC</span>
        </div>
        <div style={{maxHeight:340,overflowY:'auto'}}>
          {q.length>1 && res.length>0 && res.map(c=>(
            <div key={c.id} style={{display:'flex',alignItems:'center',gap:12,padding:'11px 18px',cursor:'pointer',transition:'background .1s'}}
              onMouseEnter={e=>e.currentTarget.style.background='rgba(0,180,216,.07)'}
              onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
              <div style={{width:34,height:34,borderRadius:8,background:'rgba(0,180,216,.08)',border:'1px solid rgba(0,180,216,.14)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><Ic n="campaigns" s={15} c="var(--accent)"/></div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:13,fontWeight:600,color:'var(--t1)',marginBottom:1}}>{c.name}</div>
                <div style={{fontSize:11,color:'var(--t2)'}}>{c.obj} · {c.platform} · <span style={{fontFamily:'JetBrains Mono'}}>${c.investment.toLocaleString()}</span></div>
              </div>
              <Badge status={c.status}/>
              <Ic n="chevR" s={13} c="rgba(139,148,158,.4)"/>
            </div>
          ))}
          {q.length>1 && res.length===0 && (
            <div style={{padding:'36px 18px',textAlign:'center'}}>
              <div style={{fontSize:13,color:'var(--t2)',marginBottom:4}}>Sin resultados para <span style={{color:'var(--t1)',fontWeight:600}}>"{q}"</span></div>
              <div style={{fontSize:11,color:'var(--t2)',opacity:.6}}>Intenta con un nombre de campaña diferente</div>
            </div>
          )}
          {q.length<=1 && (
            <div style={{padding:'16px 18px'}}>
              <div style={{fontSize:11,fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em',color:'var(--t2)',marginBottom:10}}>Campañas recientes</div>
              {CAMPAIGNS.slice(0,4).map(c=>(
                <div key={c.id} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 0',cursor:'pointer',borderRadius:6}}
                  onMouseEnter={e=>e.currentTarget.style.background='rgba(0,180,216,.05)'}
                  onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                  <Ic n="campaigns" s={13} c="var(--t2)"/>
                  <span style={{fontSize:13,color:'var(--t1)',flex:1}}>{c.name}</span>
                  <Badge status={c.status}/>
                </div>
              ))}
            </div>
          )}
        </div>
        <div style={{padding:'10px 18px',borderTop:'1px solid var(--border)',display:'flex',gap:16,fontSize:11,color:'var(--t2)'}}>
          <span><span style={{fontFamily:'JetBrains Mono',background:'rgba(30,45,61,.8)',borderRadius:4,padding:'1px 5px',marginRight:5}}>↑↓</span>Navegar</span>
          <span><span style={{fontFamily:'JetBrains Mono',background:'rgba(30,45,61,.8)',borderRadius:4,padding:'1px 5px',marginRight:5}}>↵</span>Abrir</span>
          <span><span style={{fontFamily:'JetBrains Mono',background:'rgba(30,45,61,.8)',borderRadius:4,padding:'1px 5px',marginRight:5}}>ESC</span>Cerrar</span>
        </div>
      </div>
    </div>
  );
};

const Toast = ({ msg, onDismiss }) => {
  React.useEffect(()=>{ const t=setTimeout(onDismiss,4000); return()=>clearTimeout(t); },[]);
  return <div className="toast"><div style={{width:7,height:7,borderRadius:'50%',background:'var(--ok)',flexShrink:0,boxShadow:'0 0 6px rgba(57,211,83,.6)'}}></div>{msg}</div>;
};

const Placeholder = ({ title, icon }) => (
  <div className="fade-up" style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'100%',gap:16}}>
    <div style={{width:72,height:72,borderRadius:18,background:'rgba(0,180,216,.06)',border:'1px solid rgba(0,180,216,.12)',display:'flex',alignItems:'center',justifyContent:'center'}}><Ic n={icon} s={32} c="rgba(0,180,216,.35)"/></div>
    <div style={{fontFamily:'Syne',fontSize:20,fontWeight:700,color:'var(--t2)'}}>{title}</div>
    <div style={{fontSize:13,color:'var(--t2)',opacity:.5}}>Próximamente disponible</div>
  </div>
);

const App = () => {
  const [view,setView]=React.useState('dashboard');
  const [col,setCol]  =React.useState(false);
  const [modal,setModal]=React.useState(false);
  const [toast,setToast]=React.useState(null);
  const [srch,setSrch]=React.useState(false);
  const showToast=msg=>{setToast(msg);setTimeout(()=>setToast(null),4500);};
  React.useEffect(()=>{
    const fn=e=>{
      if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();setSrch(s=>!s);}
      if(e.key==='Escape'&&srch)setSrch(false);
    };
    document.addEventListener('keydown',fn);
    return()=>document.removeEventListener('keydown',fn);
  },[srch]);
  const views={
    dashboard: <DashView onNew={()=>setModal(true)}/>,
    campaigns: <CampsView onNew={()=>setModal(true)}/>,
    adsets:    <Placeholder title="Conjuntos de Anuncios" icon="adsets"/>,
    ads:       <Placeholder title="Anuncios" icon="ads"/>,
    reports:   <RptsView/>,
    settings:  <SetView/>,
  };
  return (
    <div style={{display:'flex',height:'100vh',overflow:'hidden',background:'var(--bg-main)'}}>
      <Sidebar view={view} setView={setView} col={col} setCol={setCol}/>
      <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',minWidth:0}}>
        <TopBar view={view} onSearch={()=>setSrch(true)}/>
        <div style={{flex:1,overflow:'hidden'}}>{views[view]||views.dashboard}</div>
      </div>
      <Modal open={modal} onClose={()=>setModal(false)} onDone={()=>showToast('¡Campaña creada exitosamente!')}/>
      {toast && <Toast msg={toast} onDismiss={()=>setToast(null)}/>}
      {srch && <SearchOverlay onClose={()=>setSrch(false)}/>}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
